[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nano-harness"
version = "0.1.0"
description = "Companion code for the Agent Harness Engineering series"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nano_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"